name: CI (build and test)

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo. It uses NO secrets,
# so it is safe to run on pull requests from forks.
permissions:
  contents: read

jobs:
  core-tests:
    name: Agent core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Refuse to run if gradle-wrapper.jar is not an official Gradle release (supply-chain check).
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Runs the agent-core test suite (see agent-core/build.gradle.kts: runAgentTests).
      - name: Run agent-core tests
        run: ./gradlew :agent-core:check --stacktrace

  android-build:
    name: Build debug APKs
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already includes the Android SDK; just accept licenses so Gradle can download what it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Refuse to run if gradle-wrapper.jar is not an official Gradle release (supply-chain check).
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: List APKs
        run: ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

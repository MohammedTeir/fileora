name: Synapse Release (signed APKs, all architectures)

on:
  # Push a tag like v0.1.0 to build, sign and publish a GitHub Release.
  push:
    tags: ["v*"]
  # Or run it by hand from the Actions tab: builds and signs, but publishes no Release.
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for a manual build"
        default: "0.0.0-manual"
        required: true

# One release build at a time.
concurrency:
  group: release
  cancel-in-progress: false

# Default is read-only; only the publishing job below is allowed to write.
permissions:
  contents: read

jobs:
  test:
    name: Agent core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # Refuse to run if gradle-wrapper.jar is not an official Gradle release (supply-chain check).
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run agent-core tests
        run: ./gradlew :agent-core:check --stacktrace

  build-and-sign:
    name: Build signed APKs (arm64-v8a, armeabi-v7a, x86, x86_64, universal)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed only to attach files to the GitHub Release
    env:
      # Passed through env vars (not inlined into scripts) so a crafted tag name cannot inject commands.
      VERSION_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
      EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runners already include the Android SDK ($ANDROID_HOME). We only accept
      # the licenses so Gradle can download the platform/build-tools it needs.
      # (android-actions/setup-android@v3 was removed: it runs `sdkmanager tools`, which no longer exists.)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Refuse to run if gradle-wrapper.jar is not an official Gradle release (supply-chain check).
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          # Written outside the workspace so it can never be packaged or committed by accident.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${VERSION_NAME#v}"
          ./gradlew :app:assembleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$VERSION" \
            --stacktrace

      - name: Verify signatures
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APKs were produced"; exit 1
          fi
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          for apk in "${APKS[@]}"; do
            case "$apk" in
              *unsigned*) echo "::error::$apk is UNSIGNED"; exit 1 ;;
            esac
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | tee "$RUNNER_TEMP/cert.txt"
            FP="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/cert.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')"
            if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
              WANT="$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
              if [ "$FP" != "$WANT" ]; then
                echo "::error::Signing certificate $FP does not match EXPECTED_CERT_SHA256"; exit 1
              fi
            fi
          done
          echo "Signing certificate SHA-256: $FP"

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true

      # Runs even if an earlier step failed, so the key never lingers on the runner.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

